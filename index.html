<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=5">
<meta name="theme-color" content="#3E1708">
<meta name="description" content="Cardápio Digital — Padaria da Eli — Pães e Doces desde 1998">
<title>Cardápio — Padaria da Eli</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#FFF9F0;
  --surface:#fff;
  --text:#3E1708;
  --muted:#7A5C4F;
  --accent:#7B2D12;
  --combo-bg:#FFF3D6;
  --combo-border:#C4922A;
  --divider:#E8D5C4;
  --price:#6B1D0A;
  --radius:12px;
  --shadow:0 2px 8px rgba(62,23,8,.08);
  --topo-h:52px;
}
html{
  font-size:16px;
  -webkit-text-size-adjust:100%;
  scroll-behavior:smooth;
  scroll-padding-top:calc(var(--topo-h) + 12px);
}
body{
  font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Oxygen,Ubuntu,Cantarell,sans-serif;
  background:var(--bg);
  color:var(--text);
  line-height:1.45;
  min-height:100dvh;
  -webkit-font-smoothing:antialiased;
}
.topo{
  position:sticky;
  top:0;
  z-index:10;
  background:var(--text);
  color:#FFF9F0;
  height:var(--topo-h);
  padding:0 1rem;
  display:flex;
  align-items:center;
  gap:.75rem;
  box-shadow:0 2px 12px rgba(62,23,8,.25);
}
.topo h1{font-size:1.1rem;font-weight:700;flex:1}
.topo .tag{
  font-size:.65rem;
  background:var(--combo-border);
  color:var(--text);
  padding:.2rem .6rem;
  border-radius:20px;
  font-weight:700;
  white-space:nowrap;
}
.wrap{padding:.75rem 1rem;max-width:600px;margin:0 auto}

/* ── Navegação rápida ── */
.nav{
  display:flex;
  gap:.5rem;
  overflow-x:auto;
  padding:.75rem 0;
  margin-bottom:.5rem;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.nav::-webkit-scrollbar{display:none}
.nav a{
  flex-shrink:0;
  padding:.45rem .8rem;
  background:var(--surface);
  border:1.5px solid var(--divider);
  border-radius:20px;
  font-size:.78rem;
  font-weight:600;
  color:var(--text);
  text-decoration:none;
  -webkit-tap-highlight-color:transparent;
  transition:background .15s,border-color .15s,color .15s;
}
.nav a:hover,.nav a:focus-visible{
  background:var(--accent);
  color:#fff;
  border-color:var(--accent);
  outline:none;
}

/* ── Combos (destaque) ── */
.combos{
  background:var(--combo-bg);
  border:2px solid var(--combo-border);
  border-radius:var(--radius);
  padding:1rem;
  margin-bottom:1.25rem;
}
.combos h2{font-size:1.15rem;font-weight:800;margin-bottom:.75rem;color:var(--accent)}
.combos .preco{font-size:1.4rem}

/* ── Categorias ── */
.cat{margin-bottom:1.25rem}
.cat h2{
  font-size:1.1rem;
  font-weight:800;
  padding-bottom:.4rem;
  margin-bottom:.6rem;
  border-bottom:2px solid var(--accent);
  color:var(--accent);
}

/* ── Item ── */
.item{
  display:flex;
  justify-content:space-between;
  align-items:baseline;
  padding:.65rem 0;
  border-bottom:1px solid var(--divider);
  gap:.75rem;
}
.item:last-child{border-bottom:none}
.nome{font-size:1.05rem;font-weight:600;flex:1;min-width:0}
.desc{display:block;font-size:.8rem;font-weight:400;color:var(--muted);margin-top:.1rem}
.preco{font-size:1.3rem;font-weight:800;color:var(--price);white-space:nowrap;flex-shrink:0}

.rodape{text-align:center;padding:1.5rem 1rem;font-size:.75rem;color:var(--muted)}
.rodape a{color:var(--accent);text-decoration:none}

@media(min-width:480px){
  .wrap{padding:1rem 1.5rem}
  .nome{font-size:1.1rem}
  .preco{font-size:1.4rem}
  .combos .preco{font-size:1.55rem}
}
@media(prefers-color-scheme:dark){
  :root{
    --bg:#1A0E06;
    --surface:#2C1C10;
    --text:#F5E6D0;
    --muted:#B09880;
    --accent:#D4874A;
    --combo-bg:#2E2210;
    --combo-border:#C4922A;
    --divider:#3D2A1C;
    --price:#D4A234;
    --shadow:0 2px 8px rgba(0,0,0,.3);
  }
  .topo{background:#120A04}
}
</style>
</head>
<body>

<div id="app"></div>

<noscript>
<p style="padding:2rem;text-align:center;font-family:system-ui;font-size:1.2rem;color:#3E1708">
  Este cardápio requer JavaScript habilitado para funcionar.
</p>
</noscript>

<script>
(function(){
  "use strict";

  /* ╔══════════════════════════════════════════════════════════════════════╗
     ║                                                                    ║
     ║   ÁREA DE EDIÇÃO RÁPIDA — Altere preços e produtos aqui embaixo   ║
     ║                                                                    ║
     ║   • Para alterar um preço: mude o valor entre aspas (ex: "26,00") ║
     ║   • Para adicionar um item: copie uma linha e cole abaixo         ║
     ║   • Para nova categoria: copie um bloco { titulo, itens } inteiro ║
     ║   • desc é opcional — apague se o item não tiver descrição        ║
     ║                                                                    ║
     ╚══════════════════════════════════════════════════════════════════════╝ */

  var LOJA = {
    nome: "Padaria da Eli",
    subtitulo: "Pães e Doces — Desde 1998",
    tel: "(66) 99606-2424",
    endereco: "Av. Sete de Setembro, próximo a Cargill, Alto Garças — MT"
  };

  var COMBOS = [
    { nome: "Combo Café",       desc: "Misto Quente + Café",             preco: "14,00" },
    { nome: "Combo Pastel",     desc: "Pastel de Carne + Café com Leite", preco: "16,00" },
    { nome: "Combo Reforçado",  desc: "X Burguer + Batata Simples 250g", preco: "35,00" }
  ];

  var CATEGORIAS = [
    {
      titulo: "🍔 Lanches Artesanais",
      itens: [
        { nome: "X Bacon",     desc: "Pão, hambúrguer, bacon, ovo, presunto, mussarela, alface, tomate, milho e batata palha", preco: "26,00" },
        { nome: "X Burguer",   desc: "Pão, hambúrguer, ovo, presunto e mussarela",   preco: "20,00" },
        { nome: "X Calabresa", desc: "Pão, hambúrguer, calabresa, ovo, presunto, mussarela, alface, tomate, milho e batata palha", preco: "24,00" },
        { nome: "X Salada",    desc: "Pão, hambúrguer, ovo, presunto, mussarela, alface e tomate", preco: "22,00" },
        { nome: "X Tudo",      desc: "Pão, hambúrguer, bacon, calabresa, salsicha, ovo, presunto, mussarela, alface e tomate", preco: "30,00" }
      ]
    },
    {
      titulo: "🥪 Lanches",
      itens: [
        { nome: "Churrasquinho Simples",  desc: "Pão francês, carne e mussarela",                  preco: "22,00" },
        { nome: "Churrasquinho Completo", desc: "Pão francês, carne, mussarela, alface e tomate",  preco: "25,00" },
        { nome: "Misto Completo",         desc: "Pão francês, presunto, mussarela, alface e tomate", preco: "15,00" },
        { nome: "Misto com Ovo",          desc: "Pão francês, presunto, mussarela e ovo",           preco: "12,00" },
        { nome: "Misto Frio",             desc: "Pão francês, presunto e mussarela",                preco: "8,00" },
        { nome: "Misto Quente",           desc: "Pão francês, presunto e mussarela",                preco: "10,00" },
        { nome: "Pão com Carne Moída",    preco: "10,00" },
        { nome: "Pão com Mortadela",      preco: "8,00" },
        { nome: "Pão com Ovo",            desc: "Pão francês e dois ovos",                          preco: "10,00" },
        { nome: "Pão com Queijo Frio",    preco: "8,00" },
        { nome: "Pão com Queijo Quente",  preco: "10,00" }
      ]
    },
    {
      titulo: "🥗 Lanches Natural",
      itens: [
        { nome: "Lanche Natural Patê de Frango",  preco: "13,00" },
        { nome: "Lanche Natural no Pão Francês",  preco: "10,00" }
      ]
    },
    {
      titulo: "🧆 Salgados",
      itens: [
        { nome: "Coxinha de Carne",   preco: "10,00" },
        { nome: "Coxinha de Frango",  preco: "10,00" },
        { nome: "Disco de Carne",     preco: "9,00" },
        { nome: "Hamburgão",          preco: "12,00" },
        { nome: "Mini Pastel",        desc: "Vendido no kg",  preco: "63,00" },
        { nome: "Mini Salgadinhos",   desc: "Vendido no kg",  preco: "42,00" },
        { nome: "Mini Pizza",         preco: "13,00" },
        { nome: "Presunto e Queijo",  preco: "10,00" },
        { nome: "Risole de Carne",    preco: "10,00" },
        { nome: "Risole de Frango",   preco: "10,00" },
        { nome: "Salgado Assado",     preco: "10,00" },
        { nome: "Torta (Fatia)",      preco: "10,00" }
      ]
    },
    {
      titulo: "🥟 Pastéis",
      itens: [
        { nome: "Carne",                       preco: "12,00" },
        { nome: "Carne e Gueiroba",            preco: "16,00" },
        { nome: "Carne e Queijo",              preco: "14,00" },
        { nome: "Frango",                      preco: "12,00" },
        { nome: "Frango e Catupiry",           preco: "14,00" },
        { nome: "Frango e Gueiroba",           preco: "16,00" },
        { nome: "Frango e Palmito",            preco: "14,00" },
        { nome: "Frango e Queijo",             preco: "14,00" },
        { nome: "Mega Pastel (Tudo Dentro)",   preco: "20,00" },
        { nome: "Pizza",                       preco: "17,00" },
        { nome: "Presunto e Queijo",           preco: "14,00" },
        { nome: "Queijo",                      preco: "13,00" }
      ]
    },
    {
      titulo: "🍽️ Jantinha",
      itens: [
        { nome: "Jantinha de Filé Patinho",   desc: "Arroz, feijão tropeiro, salada, filé patinho e batata frita",  preco: "27,90" },
        { nome: "Jantinha de Frango",         desc: "Arroz, feijão tropeiro, salada, filé de frango e batata frita", preco: "25,90" },
        { nome: "Stronoff Carne ou Frango",   preco: "29,90" }
      ]
    },
    {
      titulo: "🍟 Porções",
      itens: [
        { nome: "Batata Simples 250g",                preco: "20,00" },
        { nome: "Batata Simples 500g",                preco: "30,00" },
        { nome: "Batata Completa 500g",               desc: "Bacon, calabresa e cheddar",                          preco: "35,00" },
        { nome: "Porção de Calabresa com Fritas",     preco: "30,00" },
        { nome: "Porção de Filé de Frango com Fritas", preco: "42,00" },
        { nome: "Porção Família",                     desc: "Filé de frango, filé patinho, calabresa e batata frita", preco: "49,00" },
        { nome: "Porção Tilápia com Fritas",          preco: "55,00" }
      ]
    }
  ];

  /* ═══════════════════════════════════════════════════════════════════════
     FIM DA ÁREA DE EDIÇÃO — O código abaixo monta a página automaticamente
     ═══════════════════════════════════════════════════════════════════════ */

  var app = document.getElementById("app");

  function el(tag, cls) {
    var node = document.createElement(tag);
    if (cls) node.className = cls;
    return node;
  }

  function criarItem(item) {
    var row = el("div", "item");
    var n = el("span", "nome");
    n.textContent = item.nome;
    if (item.desc) {
      var d = el("span", "desc");
      d.textContent = item.desc;
      n.appendChild(d);
    }
    var p = el("span", "preco");
    p.textContent = "R$\u00A0" + item.preco;
    row.appendChild(n);
    row.appendChild(p);
    return row;
  }

  function slug(str) {
    return str.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").toLowerCase();
  }

  // Header
  var topo = el("header", "topo");
  var h1 = el("h1");
  h1.textContent = LOJA.nome;
  var tag = el("span", "tag");
  tag.textContent = LOJA.subtitulo;
  topo.appendChild(h1);
  topo.appendChild(tag);
  app.appendChild(topo);

  var wrap = el("div", "wrap");

  // Nav pills
  var nav = el("nav", "nav");
  nav.setAttribute("aria-label", "Categorias");
  var lnk = el("a");
  lnk.href = "#combos";
  lnk.textContent = "☕ Combos";
  nav.appendChild(lnk);
  for (var c = 0; c < CATEGORIAS.length; c++) {
    var a = el("a");
    a.href = "#cat-" + slug(CATEGORIAS[c].titulo);
    a.textContent = CATEGORIAS[c].titulo;
    nav.appendChild(a);
  }
  wrap.appendChild(nav);

  // Combos
  if (COMBOS.length) {
    var cb = el("section", "combos");
    cb.id = "combos";
    var h2c = el("h2");
    h2c.textContent = "☕ Combos do Dia (Mais Rápidos)";
    cb.appendChild(h2c);
    for (var i = 0; i < COMBOS.length; i++) cb.appendChild(criarItem(COMBOS[i]));
    wrap.appendChild(cb);
  }

  // Categorias
  for (var j = 0; j < CATEGORIAS.length; j++) {
    var cat = CATEGORIAS[j];
    var sec = el("section", "cat");
    sec.id = "cat-" + slug(cat.titulo);
    var h2 = el("h2");
    h2.textContent = cat.titulo;
    sec.appendChild(h2);
    for (var k = 0; k < cat.itens.length; k++) sec.appendChild(criarItem(cat.itens[k]));
    wrap.appendChild(sec);
  }

  // Rodapé
  var rod = el("footer", "rodape");
  rod.innerHTML = LOJA.endereco +
    " · <a href=\"tel:" + LOJA.tel.replace(/\D/g, "") + "\">" + LOJA.tel + "</a>" +
    "<br>Preços sujeitos a alteração sem aviso prévio." +
    "<br>Padaria da Eli &copy; " + new Date().getFullYear();
  wrap.appendChild(rod);

  app.appendChild(wrap);
})();
</script>

</body>
</html>
